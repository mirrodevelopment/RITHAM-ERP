# ── Dev profile overrides (H2 In-Memory with PostgreSQL Dialect) ───────────────
spring:
  datasource:
    url: jdbc:h2:file:./data/ritham_erp;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    repair-on-migrate: true
    validate-on-migrate: false


logging:
  level:
    com.ritham.erp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  migration:
    tesseract-data-path: D:/ritham-erp/tessdata
